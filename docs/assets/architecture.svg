<text x="752" y="335" class="n">③</text>
<line x1="778" y1="90" x2="747" y2="90" class="dl" marker-end="url(#a)"/>
<text x="754" y="83" class="n">④</text>
<text x="842" y="396" class="s">PG → POST</text>
<text x="842" y="408" class="s">/api/payments/webhook</text>

