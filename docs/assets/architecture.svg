<text x="136" y="230" class="s g">Scheduler</text>
<rect x="136" y="236" width="403" height="56" rx="6" class="box"/>
<line x1="136" y1="264" x2="539" y2="264" class="dv"/>
<text x="148" y="254" class="t g">마감 정산 · 1시간 주기</text>
<text x="318" y="254" class="s g">DeadlineSettlementScheduler</text>
<text x="148" y="282" class="t g">마감 임박 알림 · 1시간 주기</text>
<text x="318" y="282" class="s g">DeadlineSoonNotificationScheduler</text>
<rect x="548" y="236" width="197" height="56" rx="6" class="box"/>
<text x="646" y="260" class="t">결제 릴레이 · 1분 주기</text>
<text x="646" y="275" class="s">PaymentFanOutRelayScheduler</text>

<line x1="646" y1="292" x2="646" y2="320" class="dl" marker-end="url(#a)"/>
<text x="654" y="312" class="n">②</text>

<rect x="496" y="322" width="249" height="54" rx="6" class="box"/>
<text x="620" y="339" class="t">PaymentChargeExecutor</text>
<text x="620" y="353" class="s">PG 호출은 트랜잭션 밖</text>
<text x="620" y="366" class="s">조회·갱신은 PaymentService 트랜잭션</text>

<text x="136" y="316" class="l">① 참여 요청 = OrderService의 단일 @Transactional (보라 영역)</text>
<text x="136" y="330" class="l">　 공구 row 비관적 락 → 검증 · 주문 저장 (회원은 조회만)</text>
<text x="136" y="344" class="l">　 *목표 달성 시 FINISHED + 결제 레코드 + outbox 기록</text>
<text x="136" y="358" class="l">② 릴레이: outbox 1건 → 참여자별 결제 N건 요청</text>
<text x="136" y="372" class="l">③ PG 결제 요청 (트랜잭션 밖)</text>
<text x="136" y="386" class="l">④ 웹훅: 서명 검증 → 결제 상태 갱신</text>
<text x="136" y="402" class="l">※ Notification · 스케줄러 · 웹훅은 참여 트랜잭션 밖 (각자 별도 트랜잭션)</text>
<text x="745" y="406" class="s e">서비스 간 호출은 생략</text>

<rect x="780" y="70" width="124" height="306" rx="8" class="ext"/>
<text x="842" y="213" class="t">PG</text>
