.tx{fill:#8b5cf6;fill-opacity:.16;stroke:#a78bfa}
.ext,.app{stroke:#64748b}
.db{fill:#334155;stroke:#64748b}
.ln,.dl{stroke:#94a3b8}
.kl{stroke:#a78bfa}
.ah{fill:#94a3b8}
.ak{fill:#a78bfa}
}
</style>
<defs>
