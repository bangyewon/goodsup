<svg xmlns="http://www.w3.org/2000/svg" width="920" height="344" viewBox="0 0 920 344" role="img" aria-label="커밋 후 PG 직접 호출과 Transactional Outbox의 장애 시 동작 비교">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:11.5px;text-anchor:middle}
.h{font-size:13px;font-weight:700;fill:#64748b;text-anchor:start}
.t{font-weight:700;fill:#1e293b}
.s{font-size:10px;fill:#64748b}
.c{font-size:10.5px;fill:#475569;text-anchor:start}
.box{fill:#f1f5f9;stroke:#cbd5e1}
.bad{fill:#fee2e2;stroke:#dc2626}
.good{fill:#ede9fe;stroke:#8b5cf6}
.ln{stroke:#64748b;fill:none;stroke-width:1.3}
.dl{stroke:#dc2626;fill:none;stroke-width:1.3;stroke-dasharray:4 3}
.x{font-size:15px;font-weight:700;fill:#dc2626}
.ah{fill:#64748b}
.ar{fill:#dc2626}
@media (prefers-color-scheme:dark){
.t{fill:#f1f5f9}
.s,.c{fill:#94a3b8}
.box{fill:#1e293b;stroke:#475569}
.bad{fill:#450a0a;stroke:#f87171}
.good{fill:#2e1065;stroke:#a78bfa}
.ln{stroke:#94a3b8}
.dl{stroke:#f87171}
.x{fill:#f87171}
.ah{fill:#94a3b8}
.ar{fill:#f87171}
}
</style>
<defs>
<marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" class="ah"/></marker>
<marker id="r" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" class="ar"/></marker>
</defs>

<text x="24" y="30" class="h">커밋 후 PG를 직접 호출하면</text>
<rect x="24" y="44" width="180" height="56" rx="6" class="box"/>
<text x="114" y="68" class="t">참여 트랜잭션 커밋</text>
<text x="114" y="84" class="s">FINISHED 기록</text>
<line x1="204" y1="72" x2="252" y2="72" class="ln" marker-end="url(#a)"/>
<rect x="254" y="44" width="180" height="56" rx="6" class="bad"/>
<text x="344" y="68" class="t">프로세스 종료</text>
<text x="344" y="84" class="s">커밋과 PG 호출 사이</text>
<line x1="434" y1="72" x2="482" y2="72" class="dl" marker-end="url(#r)"/>
<text x="458" y="64" class="x">✕</text>
<rect x="484" y="44" width="180" height="56" rx="6" class="bad"/>
<text x="574" y="68" class="t">PG 호출 못 함</text>
<text x="574" y="84" class="s">트리거해야 한다는 기록이 없음</text>
<line x1="664" y1="72" x2="712" y2="72" class="ln" marker-end="url(#a)"/>
<rect x="714" y="44" width="180" height="56" rx="6" class="bad"/>
<text x="804" y="68" class="t">FINISHED인데</text>
<text x="804" y="84" class="s">결제 요청은 영구히 없음</text>

<text x="24" y="156" class="h">Transactional Outbox (채택)</text>
<rect x="24" y="170" width="180" height="56" rx="6" class="good"/>
<text x="114" y="190" class="t">참여 트랜잭션 커밋</text>
<text x="114" y="205" class="s">FINISHED + 결제 레코드</text>
<text x="114" y="217" class="s">+ outbox 기록을 한 번에</text>
<line x1="204" y1="198" x2="252" y2="198" class="ln" marker-end="url(#a)"/>
<rect x="254" y="170" width="180" height="56" rx="6" class="box"/>
<text x="344" y="194" class="t">릴레이 스케줄러(1분)</text>
<text x="344" y="210" class="s">outbox 조회 · claim</text>
<line x1="434" y1="198" x2="482" y2="198" class="ln" marker-end="url(#a)"/>
<rect x="484" y="170" width="180" height="56" rx="6" class="box"/>
<text x="574" y="194" class="t">PG 호출</text>
<text x="574" y="210" class="s">트랜잭션 밖</text>
<line x1="664" y1="198" x2="712" y2="198" class="ln" marker-end="url(#a)"/>
<rect x="714" y="170" width="180" height="56" rx="6" class="good"/>
<text x="804" y="194" class="t">결제 요청이 기록으로 남음</text>
<text x="804" y="210" class="s">죽어도 릴레이가 재처리</text>

<text x="24" y="266" class="c">DB 커밋과 외부 API 호출은 하나의 트랜잭션으로 묶을 수 없다. 상태 변경과 "결제를 요청해야 한다"는 기록을 같은 트랜잭션에 넣어 이 간극을 없앤다. (ADR-0004)</text>
<text x="24" y="284" class="c">위쪽은 실측이 아니라 설계상 논증이다. 아래쪽은 릴레이 동시 claim · lease 재claim 등을 통합 테스트로 확인했다.</text>
<text x="24" y="302" class="c">claim 뒤에 워커가 죽으면 lease 만료(90분, 정책 가정) 뒤에 다른 워커가 다시 처리한다. 재시도는 최대 11회(약 1시간)이며, 소진하면 FAILED로 확정한다.</text>
<text x="24" y="320" class="c">PG 중복 호출은 idempotency key에 맡겼고, 실제 PG 연동 전이라 검증하지 못했다.</text>
</svg>
