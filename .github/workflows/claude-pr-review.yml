# 셋업 방법 (권장): 터미널에서 `claude` 실행 후 `/install-github-app` 입력하면
# GitHub App 설치와 ANTHROPIC_API_KEY 시크릿 등록까지 자동으로 안내해줍니다.
# (레포 관리자 권한 필요)
#
# 참고: https://github.com/anthropics/claude-code-action

name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            이 저장소 루트의 CLAUDE.md를 먼저 읽고, 거기 정의된 아키텍처 원칙·코딩 컨벤션·
            금지 패턴을 기준으로 이 PR을 리뷰해줘. 백엔드 프로젝트 루트는 back/ 디렉터리야.

            특히 아래 항목을 중점적으로 확인해줘:
            - 트랜잭션 안에서 외부 API를 동기 호출하는 패턴이 있는지
            - N+1 쿼리를 유발할 수 있는 연관관계 접근이 있는지
            - 재고(참여 수량) 관련 로직이 락 없이 SELECT 후 UPDATE로 구현되어 있는지
            - Controller에 비즈니스 로직이 들어가 있지 않은지
            - 새로 추가된 로직에 대한 테스트가 포함되어 있는지

            설계, 가독성, 성능, 보안, 테스트 가능성 5가지 관점에서 리뷰하고,
            문제를 발견하면 심각도(Critical/Major/Minor)를 표시해줘.

            PR 브랜치는 이미 체크아웃되어 있어.
            전체 요약은 `gh pr comment`로, 코드 특정 라인에 대한 지적은
            `mcp__github_inline_comment__create_inline_comment` (confirmed: true)로 남겨줘.
            리뷰 내용은 반드시 GitHub 코멘트로만 남기고, 별도 메시지로 출력하지 마.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
