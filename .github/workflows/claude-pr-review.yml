# 셋업 방법 (OAuth — Pro/Max 구독 사용량으로 과금, 별도 API 비용 없음):
# 1. 로컬 터미널에서 `claude setup-token` 실행 → OAuth 토큰 발급
# 2. GitHub 레포 Settings → Secrets and variables → Actions → New repository secret
#    이름: CLAUDE_CODE_OAUTH_TOKEN, 값: 발급받은 토큰
# 3. GitHub App 설치가 안 되어 있다면 https://github.com/apps/claude 에서 이 레포에 설치
#
# 참고: https://github.com/anthropics/claude-code-action/blob/main/docs/setup.md

name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            이 저장소 루트의 CLAUDE.md를 먼저 읽고, 거기 정의된 아키텍처 원칙·코딩 컨벤션·
            금지 패턴을 기준으로 이 PR을 리뷰해줘. 백엔드 프로젝트 루트는 back/ 디렉터리야.

            특히 아래 항목을 중점적으로 확인해줘:
            - 트랜잭션 안에서 외부 API를 동기 호출하는 패턴이 있는지
            - N+1 쿼리를 유발할 수 있는 연관관계 접근이 있는지
            - 재고(참여 수량) 관련 로직이 락 없이 SELECT 후 UPDATE로 구현되어 있는지
            - Controller에 비즈니스 로직이 들어가 있지 않은지
            - 새로 추가된 로직에 대한 테스트가 포함되어 있는지

            설계, 가독성, 성능, 보안, 테스트 가능성 5가지 관점에서 리뷰하고,
            문제를 발견하면 심각도(Critical/Major/Minor)를 표시해줘.

            PR 브랜치는 이미 체크아웃되어 있어.
            전체 요약은 `gh pr comment`로, 코드 특정 라인에 대한 지적은
            `mcp__github_inline_comment__create_inline_comment` (confirmed: true)로 남겨줘.
            리뷰 내용은 반드시 GitHub 코멘트로만 남기고, 별도 메시지로 출력하지 마.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
